<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback Loops</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f1626;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#simwrap{position:relative;flex:2 1 0;min-height:0}
#graphwrap{position:relative;flex:1 1 0;min-height:0;border-top:2px solid #2a3654;background:#0b1120}
canvas{display:block;width:100%;height:100%}
#tabs{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;z-index:2}
.tab{width:42px;height:38px;border-radius:9px;border:2px solid #2a3654;background:rgba(20,29,48,.9);color:#cfd8e3;font-weight:800;font-size:18px;cursor:pointer;transition:background .2s}
.tab:hover{border-color:#6b7a9c}
.tab.on{border-color:#e8eef7;color:#fff;background:#2b3a5c}
body.key .tab[data-t=P]{background:#7a2347}
body.key .tab[data-t=N]{background:#1d5e47}
#ctl{position:absolute;left:12px;bottom:12px;display:flex;gap:10px;z-index:2}
.b{width:56px;height:56px;border-radius:14px;border:2px solid #3a4a70;background:rgba(20,29,48,.88);color:#e8eef7;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.b:active{transform:scale(.93)}
.b:hover{border-color:#cfd8e3}
.b.d{border-color:#ff9f43;color:#ffd1a3}
.b svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ctl.dead .b.d{opacity:.3;cursor:default}
.sep{width:2px;background:#2a3654;margin:6px 2px;border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <div id="simwrap"><canvas id="sim"></canvas><div id="tabs"></div><div id="ctl"></div></div>
  <div id="graphwrap"><canvas id="graph"></canvas></div>
</div>
<script>
"use strict";
/* ============ shared helpers ============ */
const TAU = Math.PI * 2;
const C = { bg:'#0f1626', rec:'#ffd23f', ctl:'#b07cff', eff:'#39d98a', sig:'#4cc9f0' };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const P = (x, y) => ({ x, y });
let W = 1, H = 1, U = 1;
const X = f => f * W, Y = f => f * H;
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function mix(c1, c2, k) { return c1.map((v, i) => Math.round(lerp(v, c2[i], k))); }
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function dot(ctx, x, y, r, col, a = 1) { ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, Math.max(.5, r), 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
function blob(ctx, x, y, rx, ry, col, rot = 0) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(X(x), Y(y), rx * U, ry * U, rot, 0, TAU); ctx.fill(); }
function ring(ctx, x, y, r, col, lw, a = 1) { ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(X(x), Y(y), r * U, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; }
function glow(ctx, x, y, r, col, l) {
  if (l <= .02) return; l = Math.min(1, l);
  const px = X(x), py = Y(y), R = r * U;
  const g = ctx.createRadialGradient(px, py, R * .2, px, py, R * 1.8);
  g.addColorStop(0, rgba(col, .55 * l)); g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, R * 1.8, 0, TAU); ctx.fill();
}
function rec(ctx, x, y, r, act, t) {
  ring(ctx, x, y, r, C.rec, 3);
  act = Math.min(1, act);
  if (act > .03) { const k = (t * 1.4) % 1; ring(ctx, x, y, r * (1 + k), C.rec, 2, (1 - k) * act); }
}
function ctlNode(ctx, x, y, r, act) { glow(ctx, x, y, r * 1.6, C.ctl, act); blob(ctx, x, y, r, r, C.ctl); ring(ctx, x, y, r, '#e8dcff', 1.5, .8); }
function deadNode(ctx, x, y, r) { blob(ctx, x, y, r, r, '#4b5563'); ring(ctx, x, y, r, '#6b7280', 1.5, .8); }
function deadRec(ctx, x, y, r) { ring(ctx, x, y, r, '#6b7280', 3, .7); }
const DEAD = 'rgb(110,116,128)';
function eff(ctx, x, y, r, act) { glow(ctx, x, y, r, C.eff, act); if (act > .03) ring(ctx, x, y, r, C.eff, 3, Math.min(1, act)); }
function link(ctx, a, b, col = 'rgba(255,255,255,.10)') { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash([5, 6]); ctx.beginPath(); ctx.moveTo(X(a.x), Y(a.y)); ctx.lineTo(X(b.x), Y(b.y)); ctx.stroke(); ctx.setLineDash([]); }
function emit(acc, rate, dt, fn) { acc += Math.max(0, rate) * dt; let n = 0; while (acc >= 1 && n++ < 20) { acc -= 1; fn(); } return Math.min(acc, 2); }
function bg(ctx, col = C.bg) { ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); }
function vessel(ctx, y0, y1, fill = 'rgba(150,25,45,.35)', wall = 'rgba(255,110,130,.75)') {
  ctx.fillStyle = fill; ctx.fillRect(0, Y(y0), W, Y(y1) - Y(y0));
  ctx.strokeStyle = wall; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(0, Y(y0)); ctx.lineTo(W, Y(y0)); ctx.moveTo(0, Y(y1)); ctx.lineTo(W, Y(y1)); ctx.stroke();
}
function shape(ctx, sh, x, y, r, col, a = 1) {
  ctx.globalAlpha = a; ctx.fillStyle = col;
  if (sh === 'sq') ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  else if (sh === 'crys') { ctx.beginPath(); ctx.moveTo(x, y - r * 1.3); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r * 1.3); ctx.lineTo(x - r, y); ctx.closePath(); ctx.fill(); }
  else if (sh === 'rbc') { ctx.beginPath(); ctx.ellipse(x, y, r * 1.5, r * 1.1, 0, 0, TAU); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x, y, r * .6, r * .45, 0, 0, TAU); ctx.fill(); }
  else if (sh === 'therm') { ctx.beginPath(); ctx.arc(x, y + r * .6, r * .8, 0, TAU); ctx.fill(); ctx.fillRect(x - r * .35, y - r * 1.4, r * .7, r * 2); }
  else if (sh === 'ring') { ctx.strokeStyle = col; ctx.lineWidth = r * .5; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
}
/* particle pool flowing inside a rectangular region */
class Pool {
  constructor(o) { Object.assign(this, { col: '#fff', sh: 'dot', sz: .009, vx: .05, wob: .006, acc: 0 }, o); this.p = []; }
  rnd() { return { x: this.rx + Math.random() * this.rw, y: this.ry + Math.random() * this.rh }; }
  fill(n) { this.p = []; for (let i = 0; i < n; i++) { const q = this.rnd(); this.p.push({ x: q.x, y: q.y, s: 0, ph: Math.random() * TAU, a: 1 }); } }
  live() { let n = 0; for (const q of this.p) if (q.s < 2) n++; return n; }
  adjust(target, src, sink, dt, rate = 20) {
    target = Math.max(0, Math.round(target));
    this.acc = Math.min(3, this.acc + rate * dt);
    let live = this.live();
    while (this.acc >= 1 && live !== target) {
      this.acc -= 1;
      if (live < target) {
        const q = this.rnd(), s = src || q;
        this.p.push({ x: s.x, y: s.y, tx: q.x, ty: q.y, s: 1, ph: Math.random() * TAU, a: src ? 1 : 0 }); live++;
      } else {
        const cands = this.p.filter(q => q.s === 0); if (!cands.length) break;
        const c = cands[Math.floor(Math.random() * cands.length)];
        if (sink) { c.s = 2; c.tx = sink.x; c.ty = sink.y; } else c.s = 3;
        live--;
      }
    }
  }
  update(dt, sp = 1) {
    for (const q of this.p) {
      q.ph += dt * 2;
      if (q.s === 0) {
        q.x += this.vx * sp * dt;
        if (q.x > this.rx + this.rw) q.x -= this.rw;
        if (q.x < this.rx) q.x += this.rw;
      } else if (q.s === 1 || q.s === 2) {
        const k = Math.min(1, dt * 2.6);
        q.x += (q.tx - q.x) * k; q.y += (q.ty - q.y) * k;
        if (q.s === 1) q.a = Math.min(1, q.a + dt * 2);
        if (Math.hypot(q.tx - q.x, q.ty - q.y) < .012) { if (q.s === 1) q.s = 0; else q.dead = 1; }
      } else { q.a -= dt * 2; if (q.a <= 0) q.dead = 1; }
    }
    this.p = this.p.filter(q => !q.dead);
  }
  draw(ctx) { for (const q of this.p) shape(ctx, this.sh, X(q.x), Y(q.y + (q.s === 0 ? Math.sin(q.ph) * this.wob : 0)), this.sz * U, this.col, q.a); }
}
/* signal dots travelling between two points */
class Sig {
  constructor() { this.l = []; }
  emit(a, b, col, spd = .7, r = .009) { this.l.push({ a, b, col, t: 0, spd, r }); }
  update(dt) { for (const s of this.l) s.t += dt * s.spd; this.l = this.l.filter(s => s.t < 1); }
  draw(ctx) {
    for (const s of this.l) {
      const x = lerp(s.a.x, s.b.x, s.t), y = lerp(s.a.y, s.b.y, s.t) - Math.sin(s.t * Math.PI) * .035;
      dot(ctx, X(x), Y(y), s.r * U, s.col, Math.min(1, (1 - s.t) * 5, s.t * 8));
    }
  }
}
/* free particles (drops, puffs) */
class Drops {
  constructor() { this.l = []; }
  add(x, y, vx, vy, col, r, life = 2, g = 0, sh = 'dot') { this.l.push({ x, y, vx, vy, col, r, life, max: life, g, sh }); }
  update(dt) { for (const d of this.l) { d.vy += d.g * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt; } this.l = this.l.filter(d => d.life > 0 && d.y < 1.1 && d.y > -.1); }
  draw(ctx) { for (const d of this.l) shape(ctx, d.sh, X(d.x), Y(d.y), d.r * U, d.col, Math.min(1, d.life / d.max * 2)); }
}
/* PI controller with lag: R is the effector output */
const PI = o => Object.assign({ I: 0, R: 0, Kp: 2, Ki: 1, tau: .6 }, o);
function piStep(c, err, dt) { c.I += err * dt; const tg = c.Kp * err + c.Ki * c.I; c.R += (tg - c.R) * dt / c.tau; }

/* abstract person (used by heat stroke & body temperature) */
function drawPerson(ctx, skin, jit) {
  const s = H * .76;
  const cx = X(.5) + (jit ? (Math.random() - .5) * jit * U : 0), cy = Y(.53) + (jit ? (Math.random() - .5) * jit * U * .5 : 0);
  ctx.save(); ctx.translate(cx, cy); ctx.fillStyle = skin; ctx.strokeStyle = skin; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, -.4 * s, .1 * s, 0, TAU); ctx.fill();
  ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(-.12 * s, -.27 * s, .24 * s, .44 * s, .07 * s); else ctx.rect(-.12 * s, -.27 * s, .24 * s, .44 * s); ctx.fill();
  ctx.lineWidth = .07 * s; ctx.beginPath();
  ctx.moveTo(-.11 * s, -.21 * s); ctx.lineTo(-.24 * s, .1 * s);
  ctx.moveTo(.11 * s, -.21 * s); ctx.lineTo(.24 * s, .1 * s);
  ctx.moveTo(-.06 * s, .15 * s); ctx.lineTo(-.08 * s, .45 * s);
  ctx.moveTo(.06 * s, .15 * s); ctx.lineTo(.08 * s, .45 * s); ctx.stroke();
  ctx.restore();
  const n = (dx, dy) => P((cx + dx * s) / W, (cy + dy * s) / H);
  return { head: n(0, -.4), torso: n(0, -.05), skin: [n(-.24, .1), n(.24, .1), n(-.12, -.1), n(.12, -.1), n(0, .1)], rnd: () => n((Math.random() - .5) * .3, -.25 + Math.random() * .4), s };
}
function sun(ctx, x, y, r, a) {
  if (a <= .02) return; ctx.globalAlpha = Math.min(1, a);
  blob(ctx, x, y, r, r, '#ffb703'); ctx.strokeStyle = '#ffb703'; ctx.lineWidth = 3;
  for (let i = 0; i < 10; i++) { const th = i / 10 * TAU; ctx.beginPath(); ctx.moveTo(X(x) + Math.cos(th) * r * U * 1.3, Y(y) + Math.sin(th) * r * U * 1.3); ctx.lineTo(X(x) + Math.cos(th) * r * U * 1.7, Y(y) + Math.sin(th) * r * U * 1.7); ctx.stroke(); }
  ctx.globalAlpha = 1;
}
const SKIN = [205, 213, 228], COLD = [120, 165, 255], HOT = [255, 85, 85];


/* ============ circulation loop shared by H and J ============ */
const UH = .3, UP = .2, UIV = .9;            // hole, legs pouch, IV entry (positions along the loop)
function loopGeom() { return { cx: W * .45, cy: H * .47, A: Math.min(W * .3, H * .62), B: H * .29 }; }
function rawPt(u, g) { const th = u * TAU, c = Math.cos(th), s = Math.sin(th), e = .4;
  return { x: g.cx + g.A * Math.sign(c) * Math.pow(Math.abs(c), e), y: g.cy + g.B * Math.sign(s) * Math.pow(Math.abs(s), e) }; }
let LT = null, LTkey = '';
function loopTable(g) { const key = [g.cx, g.cy, g.A, g.B].join(','); if (key === LTkey) return LT;
  const n = 600, pts = [], cum = [0]; for (let i = 0; i <= n; i++) { pts.push(rawPt(i / n, g)); if (i) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y)); }
  LT = { pts, cum, total: cum[n], n }; LTkey = key; return LT; }
function loopPt(u, g) { u = ((u % 1) + 1) % 1; const T = loopTable(g), s = u * T.total; let lo = 0, hi = T.n;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (T.cum[m] <= s) lo = m; else hi = m; }
  const k = (s - T.cum[lo]) / ((T.cum[hi] - T.cum[lo]) || 1), a = T.pts[lo], b = T.pts[hi]; return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) }; }
function takeNearest(arr, u0) { let bi = -1, bd = 9; arr.forEach((u, i) => { let d = Math.abs(u - u0); d = Math.min(d, 1 - d); if (d < bd) { bd = d; bi = i; } }); return bi >= 0 ? arr.splice(bi, 1)[0] : null; }
function spreadDots(us, flow, dt) {
  const n = us.length; if (!n) return us;
  const r = us.map(u => ((u % 1) + 1) % 1).sort((a, b) => a - b);
  let off = 0; for (let i = 0; i < n; i++) off += r[i] - i / n; off /= n;
  const k = Math.min(1, dt * 1.6);
  return r.map((u, i) => (((u + flow * dt + (off + i / n - u) * k) % 1) + 1) % 1);
}
function tubeW(P) { return U * .07 * clamp(.15 + .85 * P * P, .12, 1.8); }
function drawTube(ctx, g, P, dead) {
  ctx.beginPath(); for (let i = 0; i <= 160; i++) { const q = loopPt(i / 160, g); i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); } ctx.closePath();
  const w = tubeW(P);
  ctx.lineJoin = 'round'; ctx.strokeStyle = dead ? '#555b66' : 'rgba(255,140,160,.85)'; ctx.lineWidth = w + 7; ctx.stroke();
  ctx.strokeStyle = dead ? '#23262d' : '#3a0d18'; ctx.lineWidth = w; ctx.stroke();
}
function drawDots(ctx, g, us, a = 1, col = '#ff4d6d') { for (const u of us) { const q = loopPt(u, g); shape(ctx, 'rbc', q.x, q.y, U * .0105, col, a); } }
function gauge(ctx, P, dead) {
  const r = U * .1, x = W - U * .15, y = H * .58, top = 1.6, a0 = Math.PI * .75, a1 = Math.PI * 2.25;
  const ang = v => a0 + (a1 - a0) * clamp(v / top, 0, 1);
  ctx.fillStyle = '#141d30'; ctx.strokeStyle = '#cfd8e3'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(207,216,227,.55)'; ctx.lineWidth = 2;
  for (let v = 0; v <= top + 1e-6; v += .2) { const a = ang(v); ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r * .78, y + Math.sin(a) * r * .78); ctx.lineTo(x + Math.cos(a) * r * .9, y + Math.sin(a) * r * .9); ctx.stroke(); }
  ctx.strokeStyle = dead ? '#555b66' : '#ff4d6d'; ctx.lineWidth = r * .14; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.arc(x, y, r * .66, a0, ang(P)); ctx.stroke();
  const sa = ang(1); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(x + Math.cos(sa) * r * .5, y + Math.sin(sa) * r * .5); ctx.lineTo(x + Math.cos(sa) * r * 1.12, y + Math.sin(sa) * r * 1.12); ctx.stroke(); ctx.setLineDash([]);
  const na = ang(P); ctx.strokeStyle = dead ? '#9aa0aa' : '#ffffff'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(na) * r * .82, y + Math.sin(na) * r * .82); ctx.stroke();
  dot(ctx, x, y, r * .1, '#cfd8e3');
}
function heartShape(ctx, hx, hy, z, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(hx, hy + z);
  ctx.bezierCurveTo(hx - z * 1.6, hy - z * .1, hx - z * .9, hy - z * 1.3, hx, hy - z * .5);
  ctx.bezierCurveTo(hx + z * .9, hy - z * 1.3, hx + z * 1.6, hy - z * .1, hx, hy + z); ctx.fill();
}
function puddleY() { return H * .9; }
function drawPuddle(ctx, g, lost, dead) { if (lost <= 0) return; const q = loopPt(UH, g), rx = U * .03 * Math.sqrt(lost), ry = U * .012 * Math.sqrt(lost) * .6 + 3;
  ctx.fillStyle = dead ? '#4a2a30' : '#a4161a'; ctx.beginPath(); ctx.ellipse(q.x, puddleY(), rx, ry, 0, 0, TAU); ctx.fill(); }
function trimDrops(drops) { const py = puddleY() / H; drops.l = drops.l.filter(d => d.y < py); }
function bleedDrop(drops, g) { const q = loopPt(UH, g); drops.add(q.x / W + (Math.random() - .5) * .01, q.y / H + .02, (Math.random() - .5) * .04, .05, '#e63946', .0105, 2.2, .7, 'rbc'); }

/* ============ simulations ============ */
const SIMS = [

/* A — blood glucose (negative) */
{ type: 'N', col: '#ff9f43', glyph: 'sq', lo: .4, hi: 2, sp: 1,
  btns: [['apple', s => s.gut = Math.min(2.5, s.gut + 1.2)], ['bolt', s => s.ex = Math.min(1.2, s.ex + .6)]],
  init() { this.g = 1; this.gut = 0; this.ex = 0; this.ab = 0; this.t = 0; this.c = PI({ Kp: 1.5, Ki: .6, tau: .8 });
    this.pool = new Pool({ rx: 0, ry: .455, rw: 1, rh: .1, col: '#ff9f43', sh: 'sq', vx: .06 }); this.pool.fill(24);
    this.sig = new Sig(); this.e1 = 0; this.e2 = 0; },
  step(dt) { const ab = .5 * this.gut; this.gut -= ab * dt; this.ex *= Math.exp(-dt / 6); this.ab = ab;
    piStep(this.c, this.g - 1, dt); this.g = clamp(this.g + (ab - .8 * this.ex - .8 * this.c.R) * dt, .3, 2.3); },
  v() { return this.g; },
  anim(dt) { this.t += dt; const R = this.c.R, ins = Math.max(0, R), glu = Math.max(0, -R);
    const src = this.ab > glu * .8 ? P(.16, .3) : P(.82, .28);
    const sink = this.ex > ins * .8 ? P(.5, .82) : P(.8, .8);
    this.pool.adjust(this.g * 24, src, sink, dt, 25); this.pool.update(dt);
    this.e1 = emit(this.e1, ins * 10, dt, () => this.sig.emit(P(.2, .8), P(.78, .8), C.sig));
    this.e2 = emit(this.e2, glu * 10, dt, () => this.sig.emit(P(.2, .8), P(.82, .2), C.sig));
    this.sig.update(dt); },
  draw(ctx) { bg(ctx); const R = this.c.R, t = this.t;
    link(ctx, P(.2, .8), P(.8, .8)); link(ctx, P(.2, .8), P(.82, .2));
    vessel(ctx, .44, .58);
    blob(ctx, .16, .2, .1, .075, '#c9a27e'); blob(ctx, .16, .2, .075, .05, '#a8805c');
    for (let i = 0; i < Math.round(this.gut * 6); i++) shape(ctx, 'sq', X(.16) + Math.cos(i * 2.4) * U * .04 * (i % 3 + 1) / 3, Y(.2) + Math.sin(i * 2.4) * U * .025, U * .01, '#ff9f43');
    eff(ctx, .82, .2, .1, glu(R)); blob(ctx, .82, .2, .12, .075, '#8c3b2e', -.2);

  const dpr = window.devicePixelRatio || 1;

  simC.width = Math.round(r1.width * dpr); simC.height = Math.round(r1.height * dpr); sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gC.width = Math.round(r2.width * dpr); gC.height = Math.round(r2.height * dpr); gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = r1.width; H = r1.height; U = Math.min(W, H); GW = r2.width; GH = r2.height;

function mkBtn(icon, cls, fn) { const b = document.createElement('button'); b.className = 'b ' + cls; b.innerHTML = svg(icon); b.addEventListener('click', fn); ctlBar.appendChild(b); return b; }

  [...tabs.children].forEach((b, j) => b.classList.toggle('on', j === i));
  ctlBar.innerHTML = '';
  for (const [ic, fn] of sim.btns) mkBtn(ic, 'd', () => { if (sim.dead) return; fn(sim); if (!run) togglePause(); });
  const s = document.createElement('div'); s.className = 'sep'; ctlBar.appendChild(s);
  mkBtn('reset', '', () => select(cur));
  pauseBtn = mkBtn('pause', '', togglePause);
}
function togglePause() { run = !run; pauseBtn.innerHTML = svg(run ? 'pause' : 'play'); }
SIMS.forEach((s, i) => { const b = document.createElement('button'); b.className = 'tab'; b.textContent = 'ABCDEFGHIJ'[i]; b.dataset.t = s.type; b.addEventListener('click', () => select(i)); tabs.appendChild(b); });
document.addEventListener('keydown', e => {
  if (e.key === 'k' || e.key === 'K') document.body.classList.toggle('key');
  const n = 'abcdefghij'.indexOf(e.key.toLowerCase()); if (n >= 0 && e.key.toLowerCase() !== 'k') select(n);
  if (e.key === ' ') { e.preventDefault(); togglePause(); }

  const pad = (hi - lo) * .06;
  if (lo < sim.lo) lo -= pad; if (hi > sim.hi) hi += pad;
  gLo += (lo - gLo) * .15; gHi += (hi - gHi) * .15;
  if (lo < gLo) gLo = lo; if (hi > gHi) gHi = hi;
  const yOf = v => tp + (1 - (v - gLo) / (gHi - gLo)) * (h - tp - bt);
  const xOf = tt => l + (tt - t0) / WIN * (w - l - r);
  g.strokeStyle = 'rgba(255,255,255,.06)'; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) { const y = tp + i / 4 * (h - tp - bt); g.beginPath(); g.moveTo(l, y); g.lineTo(w - r, y); g.stroke(); }
  for (let s = Math.ceil(t0 / 5) * 5; s <= t0 + WIN; s += 5) { const x = xOf(s); g.beginPath(); g.moveTo(x, tp); g.lineTo(x, h - bt); g.stroke(); }
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2; g.beginPath(); g.moveTo(l, tp); g.lineTo(l, h - bt); g.lineTo(w - r, h - bt); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 2; g.setLineDash([8, 7]); g.beginPath(); g.moveTo(l, yOf(sim.sp)); g.lineTo(w - r, yOf(sim.sp)); g.stroke(); g.setLineDash([]);
  shape(g, sim.glyph, l / 2, tp + 12, 8, sim.col);
  if (hist.length > 1) {
    g.strokeStyle = sim.col; g.lineWidth = 3; g.lineJoin = 'round'; g.beginPath();
    hist.forEach(([tt, v], i) => { const x = xOf(tt), y = yOf(v); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
    const [tt, v] = hist[hist.length - 1]; g.fillStyle = sim.col; g.beginPath(); g.arc(xOf(tt), yOf(v), 6, 0, TAU); g.fill();
  }
}
function frame(ts) {
  const dt = Math.min(.05, ((ts - last) / 1000) || 0); last = ts;
  if (run && dt > 0) {
    const n = Math.max(1, Math.round(dt / DT)), h = dt / n;
    for (let i = 0; i < n; i++) { sim.step(h); t += h; sampAcc += h; if (sampAcc >= .05) { sampAcc -= .05; hist.push([t, sim.v()]); } }
    while (hist.length && hist[0][0] < t - WIN - 1) hist.shift();
    sim.anim(dt);
  }
  ctlBar.classList.toggle('dead', !!sim.dead);
  sim.draw(sctx); drawGraph();
  requestAnimationFrame(frame);
}
resize(); select(0); requestAnimationFrame(frame);
</script>
